name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir public
          sha="${GITHUB_SHA::7}"
          sed -e "s/content=\"dev\"/content=\"$sha\"/" \
              -e "s/href=\"style.css\"/href=\"style.css?v=$sha\"/" \
              -e "s/src=\"app.js\"/src=\"app.js?v=$sha\"/" \
              -e "s/src=\"engine-host.js\"/src=\"engine-host.js?v=$sha\"/" \
              index.html > public/index.html
          cp app.js engine-host.js engine-worklet.js style.css preview.png favicon.svg public/
          printf '%s\n' "$sha" > public/version.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
